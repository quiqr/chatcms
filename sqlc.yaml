version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        output_db_file_name: db.generated.go
        output_models_file_name: models.generated.go
        output_files_suffix: .generated
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
