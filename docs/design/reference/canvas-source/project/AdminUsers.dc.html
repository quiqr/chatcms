<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiqr ChatCMS — Platform admin · Users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F5}
a{color:#0B6BAA}a:hover{color:#08578C}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; background: #F7F7F5">
  <aside aria-label="Platform admin navigation" style="flex: 1 1 240px; box-sizing: border-box; background: #18181B; color: #FAFAFA; padding: 14px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <img src="quiqr-logo.svg" alt="Quiqr" style="height: 24px; width: auto; display: block;">
      <span style="font-size: 15px; color: #A1A1AA">ChatCMS</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #27272A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7CCBFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/></svg>
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #A1A1AA">You’re in</span><span style="font-size: 14px; font-weight: 600">Platform admin</span></span>
    </div>
    <nav aria-label="Platform admin" style="display: flex; flex-direction: column; gap: 2px">
      <a href="AdminOrgs.dc.html" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: #D4D4D8; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h2a2 2 0 0 1 2 2v10"/><path d="M8 7h4M8 11h4M8 15h4M2 21h20"/></svg><span style="flex: 1">Organisations</span><span style="font-size: 12px; color: #A1A1AA">6</span></a>
      <a href="AdminUsers.dc.html" aria-current="page" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #3F3F46; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span style="flex: 1">Users</span><span style="font-size: 12px; color: #D4D4D8">46</span></a>
    </nav>
    <div style="flex: 1"></div>
    <a href="Projects.dc.html" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: #D4D4D8; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to my projects</a>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid #3F3F46">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #E6F2FB; color: #0A5A8F; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</span>
      <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">Pim Snel</span><span style="font-size: 12px; color: #A1A1AA">Platform admin</span></span>
    </div>
  </aside>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 32px; border-bottom: 1px solid #E5E5E2; background: #FFFFFF">
      <h1 style="margin: 0; font-size: 18px; font-weight: 600; flex: 1">Users</h1>
      <label style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 8px; background: #FFFFFF; flex: 0 1 260px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search by name or email</span>
        <input type="search" placeholder="Search by name or email" style="border: 0; outline: 0; font: inherit; font-size: 14px; flex: 1; min-width: 0; background: transparent">
      </label>
      <button type="button" style="height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 8px; background: #0B6BAA; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Invite user</button>
    </header>

    <main style="padding: 24px 32px 56px; display: flex; flex-direction: column; gap: 16px">
      <div role="group" aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" aria-pressed="true" style="height: 34px; padding: 0 12px; border: 1px solid #18181B; border-radius: 999px; background: #18181B; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">All · 46</button>
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Platform admins · 2</button>
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Invited · 3</button>
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Blocked · 1</button>
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Not in any organisation · 2</button>
      </div>

      <div style="position: relative; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 14px; overflow-x: auto; padding-bottom: 4px">
        <table style="width: 100%; min-width: 880px; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="text-align: left; color: #6B6B73; font-size: 12px">
              <th scope="col" style="padding: 12px 20px; font-weight: 500; border-bottom: 1px solid #EDEDEA">User</th>
              <th scope="col" style="padding: 12px; font-weight: 500; border-bottom: 1px solid #EDEDEA">Organisations</th>
              <th scope="col" style="padding: 12px; font-weight: 500; border-bottom: 1px solid #EDEDEA">Status</th>
              <th scope="col" style="padding: 12px; font-weight: 500; border-bottom: 1px solid #EDEDEA">Last sign-in</th>
              <th scope="col" style="padding: 12px 20px; border-bottom: 1px solid #EDEDEA"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{users}}" as="u" hint-placeholder-count="8">
              <tr>
                <td style="padding: 11px 20px; border-bottom: 1px solid #F1F1EE">
                  <div style="display: flex; align-items: center; gap: 12px">
                    <span style="width: 32px; height: 32px; border-radius: 50%; background: {{u.bg}}; color: {{u.fg}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none">{{u.init}}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px">
                      <span style="display: flex; align-items: center; gap: 8px; font-weight: 500">{{u.name}}<sc-if value="{{u.admin}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; color: #FFFFFF; background: #18181B; border-radius: 999px; padding: 2px 8px">Platform admin</span></sc-if></span>
                      <span style="font-size: 13px; color: #6B6B73">{{u.email}}</span>
                    </span>
                  </div>
                </td>
                <td style="padding: 11px 12px; border-bottom: 1px solid #F1F1EE; color: {{u.orgColor}}">{{u.orgs}}</td>
                <td style="padding: 11px 12px; border-bottom: 1px solid #F1F1EE"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: {{u.stFg}}; background: {{u.stBg}}; border-radius: 999px; padding: 3px 9px"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{u.stDot}}"></span>{{u.status}}</span></td>
                <td style="padding: 11px 12px; border-bottom: 1px solid #F1F1EE; color: #52525B">{{u.last}}</td>
                <td style="position: relative; padding: 11px 20px; border-bottom: 1px solid #F1F1EE; text-align: right">
                  <button type="button" aria-label="Actions for {{u.name}}" aria-expanded="{{u.menu}}" style="{{u.btnStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
                  <sc-if value="{{u.menu}}" hint-placeholder-val="{{ false }}">
                    <div role="menu" style="position: absolute; right: 20px; top: 48px; z-index: 4; width: 230px; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 10px; box-shadow: 0 12px 32px rgba(16,24,40,.12); padding: 6px; display: flex; flex-direction: column; text-align: left">
                      <button type="button" role="menuitem" style="height: 38px; text-align: left; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; cursor: pointer">Edit name and email</button>
                      <button type="button" role="menuitem" style="height: 38px; text-align: left; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; cursor: pointer">Send password reset</button>
                      <button type="button" role="menuitem" style="height: 38px; text-align: left; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; cursor: pointer">Add to organisation…</button>
                      <button type="button" role="menuitem" style="height: 38px; text-align: left; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; cursor: pointer">Make platform admin</button>
                      <div style="height: 1px; background: #EDEDEA; margin: 4px 0"></div>
                      <button type="button" role="menuitem" style="height: 38px; text-align: left; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; color: #92400E; cursor: pointer">Block sign-in</button>
                      <button type="button" role="menuitem" style="height: 38px; text-align: left; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; color: #B91C1C; cursor: pointer">Delete user…</button>
                    </div>
                  </sc-if>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 20px; font-size: 13px; color: #52525B">
          <span>Showing 1–8 of 46</span>
          <div style="display: flex; gap: 6px">
            <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 7px; background: #FFFFFF; font: inherit; font-size: 13px; color: #6B6B73; cursor: pointer">Previous</button>
            <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 7px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const ST = {
      Active: ['#166534', '#EAF6EE', '#16A34A'],
      Invited: ['#92400E', '#FEF3E2', '#D97706'],
      Blocked: ['#991B1B', '#FDECEC', '#DC2626']
    };
    const rows = [
      ['PS', 'Pim Snel', 'pim@studionoord.nl', true, 'Studio Noord (admin)', 'Active', 'Now', '#E6F2FB', '#0A5A8F'],
      ['HN', 'Hanna Nijboer', 'hanna@chatcms.eu', true, '', 'Active', 'Yesterday', '#F1F1EE', '#3F3F46'],
      ['MH', 'Marieke Holt', 'm.holt@lindewaard.nl', false, 'Gemeente Lindewaard (admin)', 'Active', '2 days ago', '#E1EDD5', '#3F6212'],
      ['EV', 'Eva de Vries', 'eva@korenaar.nl', false, 'Studio Noord, Bakkerij Korenaar', 'Active', '12 min ago', '#F3E3D3', '#9A3412'],
      ['LM', 'Lotte Mulder', 'lotte@studionoord.nl', false, 'Studio Noord (admin)', 'Active', '3 days ago', '#EDE4F6', '#5B21B6'],
      ['SS', 'sanne@korenaar.nl', 'Invited by Pim Snel', false, 'Studio Noord', 'Invited', '—', '#FFFFFF', '#6B6B73'],
      ['BW', 'Bas Wolters', 'bas.wolters@example.org', false, '', 'Blocked', '4 weeks ago', '#F1F1EE', '#3F3F46'],
      ['AV', 'Anouk Visser', 'anouk@duinzicht.nl', false, 'Duinzicht Camping (admin)', 'Active', 'Last week', '#EDE4F6', '#5B21B6']
    ];
    const base = 'width: 36px; height: 36px; border: 0; border-radius: 7px; color: #3F3F46; cursor: pointer; ';
    return {
      users: rows.map(([init, name, email, admin, orgs, status, last, bg, fg], i) => ({
        init, name, email, admin, last, bg, fg, status,
        orgs: orgs || 'Not in any organisation',
        orgColor: orgs ? '#3F3F46' : '#6B6B73',
        stFg: ST[status][0], stBg: ST[status][1], stDot: ST[status][2],
        menu: i === 3,
        btnStyle: base + (i === 3 ? 'background: #F1F1EE;' : 'background: transparent;')
      }))
    };
  }
}
</script>
</body>
</html>
