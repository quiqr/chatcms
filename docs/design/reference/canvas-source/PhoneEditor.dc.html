<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiqr ChatCMS — Edit page on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6BAA}a:hover{color:#08578C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F5; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 12px 10px; background: #FFFFFF; border-bottom: 1px solid #E5E5E2; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="PhoneContent.dc.html" aria-label="Back to News" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Our spring bread is back</span><span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #52525B"><span style="width: 6px; height: 6px; border-radius: 50%; background: #16A34A"></span>Saved</span></span>
      <button type="button" aria-label="More" style="width: 44px; height: 44px; border: 0; background: transparent; color: #52525B"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </div>
    <div role="group" aria-label="View" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; background: #F1F1EE; border-radius: 10px; margin: 0 4px">
      <button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 7px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,.08); font: inherit; font-size: 14px; font-weight: 500">Edit</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 14px; color: #52525B">Preview</button>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 18px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pt" style="font-size: 14px; font-weight: 500">Title</label>
      <input id="pt" type="text" value="Our spring bread is back" style="height: 46px; padding: 0 12px; border: 1px solid #D9D9D5; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 500">Cover image</span>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid #E5E5E2; border-radius: 10px; background: #FFFFFF">
        <span role="img" aria-label="Spelt loaves on a wooden board" style="width: 72px; height: 54px; border-radius: 6px; background: #D8E6D2; flex: none"></span>
        <span style="flex: 1; font-size: 14px">spring-spelt.jpg</span>
        <button type="button" style="height: 40px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500">Replace</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ps" style="font-size: 14px; font-weight: 500">Summary</label>
      <textarea id="ps" rows="3" style="padding: 10px 12px; border: 1.5px solid #0B6BAA; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 16px; line-height: 1.5; resize: none; box-shadow: 0 0 0 3px #E6F2FB">From this week our spelt and honey loaf is back on the shelves, baked fresh every morning.</textarea>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 500">Body</span>
      <div style="border: 1px solid #D9D9D5; border-radius: 10px; background: #FFFFFF; overflow: hidden">
        <div role="toolbar" aria-label="Formatting" style="display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid #EDEDEA; background: #FAFAF8">
          <button type="button" aria-label="Heading" style="width: 44px; height: 40px; border: 0; background: transparent; font: inherit; font-weight: 600; color: #3F3F46">H</button>
          <button type="button" aria-label="Bold" style="width: 44px; height: 40px; border: 0; background: transparent; font: inherit; font-weight: 700; color: #3F3F46">B</button>
          <button type="button" aria-label="Italic" style="width: 44px; height: 40px; border: 0; background: transparent; font: inherit; font-style: italic; color: #3F3F46">I</button>
          <button type="button" aria-label="Bulleted list" style="width: 44px; height: 40px; border: 0; background: transparent; color: #3F3F46; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
          <button type="button" aria-label="Insert image" style="width: 44px; height: 40px; border: 0; background: transparent; color: #3F3F46; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
        </div>
        <p style="margin: 0; padding: 12px 14px; font-size: 16px; line-height: 1.6; color: #27272A">After a long winter, the <strong>spelt and honey loaf</strong> is back. We bake it with flour from the Lindewaard mill…</p>
      </div>
    </div>
  </main>

  <div style="display: flex; gap: 10px; padding: 12px 16px 30px; background: #FFFFFF; border-top: 1px solid #E5E5E2">
    <button type="button" aria-label="Assistant" style="width: 48px; height: 48px; border: 1px solid #E5E5E2; border-radius: 10px; background: #FFFFFF; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <a href="PhonePublish.dc.html" style="flex: 1; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; background: #0B6BAA; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Publish<span style="font-size: 12px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 1px 7px">4</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
