<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiqr ChatCMS — Publish on a phone</title>


<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6BAA}a:hover{color:#08578C}
</style>

<style>
html,body{background:#F7F7F5}
*{-webkit-tap-highlight-color:transparent}
.qp-screens{position:fixed;right:calc(12px + env(safe-area-inset-right, 0px));bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:50;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#18181B;color:#FAFAFA;font:500 13px Geist,ui-sans-serif,system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.qp-screens:hover{color:#FFFFFF;background:#27272A}
.qp-screens:focus-visible{outline:2px solid #37B6FF;outline-offset:2px}
</style>
</head>
<body>

<div style="max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F7F7F5; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 10px; background: #FFFFFF; border-bottom: 1px solid #E5E5E2; display: flex; align-items: center; gap: 6px">
    <a href="phone-editor.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Publish</span>
  </header>

  <main style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em">4 changes ready</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #52525B">Last published Tuesday by Joris Bakker.</p>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 14px">
      <li style="display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid #F1F1EE">
        <span style="font-size: 12px; font-weight: 500; color: #92400E; background: #FEF3E2; border-radius: 6px; padding: 3px 7px; flex: none">Changed</span>
        <span style="flex: 1; min-width: 0; font-size: 15px">Our spring bread is back</span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid #F1F1EE">
        <span style="font-size: 12px; font-weight: 500; color: #1E40AF; background: #EAF0FD; border-radius: 6px; padding: 3px 7px; flex: none">New</span>
        <span style="flex: 1; min-width: 0; font-size: 15px">Closed on King’s Day</span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid #F1F1EE">
        <span style="font-size: 12px; font-weight: 500; color: #92400E; background: #FEF3E2; border-radius: 6px; padding: 3px 7px; flex: none">Changed</span>
        <span style="flex: 1; min-width: 0; font-size: 15px">About us</span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 14px">
        <span style="font-size: 12px; font-weight: 500; color: #1E40AF; background: #EAF0FD; border-radius: 6px; padding: 3px 7px; flex: none">New</span>
        <span style="flex: 1; min-width: 0; font-size: 15px">spring-spelt.jpg</span>
      </li>
    </ul>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pn" style="font-size: 14px; font-weight: 500">What’s in this update? <span style="font-weight: 400; color: #6B6B73">Optional</span></label>
      <input id="pn" type="text" placeholder="e.g. Spring bread" style="height: 46px; padding: 0 12px; border: 1px solid #D9D9D5; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 16px">
    </div>
  </main>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 30px; background: #FFFFFF; border-top: 1px solid #E5E5E2">
    <a href="publish-building.html" style="color: #18181B; height: 50px; border: 0; border-radius: 10px; background: #0B6BAA; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">Publish 4 changes</a>
    <span style="text-align: center; font-size: 13px; color: #6B6B73">Your site updates in a minute or two.</span>
  </div>
</div>

<a class="qp-screens" href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>All screens</a>
</body>
</html>
